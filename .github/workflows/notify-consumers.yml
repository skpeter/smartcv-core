name: Notify game repos

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repo:
          - SmartCV-SSBU
          - SmartCV-GGST
          - SmartCV-RoA2
          - SmartCV-SF6
    steps:
      - name: Trigger bump-core workflow
        env:
          GH_TOKEN: ${{ secrets.CONSUMER_PAT }}
        run: gh workflow run "Bump core submodule" --repo "skpeter/${{ matrix.repo }}" --ref main
