name: Notify game repos

on:
  # Auto-bump paused until sibling paddle CI is on main; trigger manually if needed.
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repo:
          - SmartCV-SSBU
          - SmartCV-GGST
          - SmartCV-RoA2
          - SmartCV-SF6
          - SmartCV-Avatar
          - SmartCV-Tokon
    steps:
      - name: Trigger bump-core workflow
        env:
          GH_TOKEN: ${{ secrets.CONSUMER_PAT }}
        run: gh workflow run "Bump core submodule" --repo "skpeter/${{ matrix.repo }}" --ref main
